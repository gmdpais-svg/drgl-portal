<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycby5hpRvvQq9DYhaBhd7EKwXu5hCBUcmGdRadTHj71CkojC2EAb1XQvqI6i7JJ9NsgFLPQ/exec">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRGL Field Operations Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a237e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container { padding: 40px 20px; }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; }
    .sub { font-size: 0.95rem; opacity: 0.75; margin-bottom: 32px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px; }
    a { color: #90caf9; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">DRGL</div>
    <div class="sub">Field Operations Portal</div>
    <div class="spinner"></div>
    <div class="msg">Redirecting you to the portal…</div>
    <a href="https://script.google.com/macros/s/AKfycby5hpRvvQq9DYhaBhd7EKwXu5hCBUcmGdRadTHj71CkojC2EAb1XQvqI6i7JJ9NsgFLPQ/exec">
      Click here if you are not redirected automatically
    </a>
  </div>
  <script>
    window.location.replace("https://script.google.com/macros/s/AKfycby5hpRvvQq9DYhaBhd7EKwXu5hCBUcmGdRadTHj71CkojC2EAb1XQvqI6i7JJ9NsgFLPQ/exec");
  </script>
</body>
</html>
